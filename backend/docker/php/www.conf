[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000
listen.owner = www-data
listen.group = www-data

; Dynamic process manager — sized for multi-tenant concurrency and fast throughput
pm = dynamic
pm.max_children = 30
pm.start_servers = 8
pm.min_spare_servers = 6
pm.max_spare_servers = 14
pm.max_requests = 1000
pm.process_idle_timeout = 30s

; Timeouts — fail-fast at 60s instead of starving worker pool for 300s
request_terminate_timeout = 60s

; Slowlog — log queries and traces exceeding 3 seconds for proactive observability
slowlog = /var/log/php-fpm-slow.log
request_slowlog_timeout = 3s

; Logging
php_flag[display_errors] = off
php_admin_flag[log_errors] = on
