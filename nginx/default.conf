server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Allow large payloads (bulk import)
    client_max_body_size 50M;

    # Reverse proxy MinIO via backend API (MUST be before /api location)
    location /api/minio {
        proxy_pass http://backend:80/api/minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        # Increase timeouts for large file downloads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Ensure PDF/images can render inline while protecting against clickjacking
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Cache-Control "private, max-age=3600" always;
    }

    # Reverse proxy API requests to backend
    # BACKEND_URL is replaced at container startup via entrypoint
    location /api {
        proxy_pass http://backend:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Allow large file uploads
        client_max_body_size 50M;
        proxy_request_buffering off;
    }

    # Reverse proxy storage/uploads
    location /storage {
        proxy_pass http://backend:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy Excel template downloads
    location ~ ^/TEMPLATE_IMPORT_DATA_.*\.xlsx$ {
        proxy_pass http://backend:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block access to source maps in production
    location ~* \.map$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # Handle React Router (SPA) - must be last
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Allow camera access for QR scanner pages
    add_header Permissions-Policy "camera=*, microphone=()" always;
    # HSTS (Strict-Transport-Security) — 1 year, include subdomains, no preload
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content-Security-Policy (CSP) — tailored for SIMMACI assets & services
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://o4508930438103040.ingest.us.sentry.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://api.simmaci.com https://simmaci.com https://o4508930438103040.ingest.us.sentry.io; frame-src 'self' blob:; frame-ancestors 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self';" always;

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
