# Map external HTTPS protocol to HSTS header.
# RFC 6797 requirement: HSTS MUST NOT be sent over insecure HTTP.
# Since Traefik terminates TLS and forwards via HTTP to Nginx with X-Forwarded-Proto,
# we only send HSTS when X-Forwarded-Proto is https or the local scheme is https.

map $http_x_forwarded_proto $hsts_header {
    default "";
    https "max-age=31536000; includeSubDomains";
}
