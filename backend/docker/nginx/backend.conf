server {
    listen 0.0.0.0:80;
    server_name _;
    index index.php index.html;
    root /var/www/html/public;

    error_log /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;

    # Keepalive — prevent Traefik from dropping idle connections
    keepalive_timeout 65s;
    keepalive_requests 100;

    # Allow large payloads (bulk teacher/student import)
    client_max_body_size 50M;

    # Sane timeout limits — fail fast at 60s to prevent worker starvation
    fastcgi_read_timeout 60s;
    fastcgi_send_timeout 60s;
    proxy_read_timeout 60s;
    proxy_connect_timeout 15s;

    # FastCGI buffer settings to prevent JSON buffering to temporary disk files
    fastcgi_buffers 32 32k;
    fastcgi_buffer_size 64k;
    fastcgi_busy_buffers_size 128k;

    # Lightweight health check — no PHP, no DB, instant response
    location = /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Deny direct execution of PHP files in storage or public directories
    location ~* /storage/.*\.php$ {
        deny all;
        return 404;
    }

    # Only pass index.php to FastCGI
    location = /index.php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        include fastcgi_params;
        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
        fastcgi_connect_timeout 60s;
        fastcgi_keep_conn on;
    }

    # Block direct execution of any other .php file
    location ~ \.php$ {
        deny all;
        return 404;
    }

    location ~ /\.ht {
        deny all;
    }
}
