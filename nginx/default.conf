server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Allow large payloads (bulk import)
    client_max_body_size 50M;

    # Reverse proxy MinIO via backend API (MUST be before /api location)
    location /api/minio {
        proxy_pass http://backend:80/api/minio;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        # Increase timeouts for large file downloads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Ensure PDF/images can render inline while protecting against clickjacking
        add_header Cache-Control "private, max-age=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    # Reverse proxy API requests to backend
    # BACKEND_URL is replaced at container startup via entrypoint
    location /api {
        proxy_pass http://backend:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        # Allow large file uploads
        client_max_body_size 50M;
        proxy_request_buffering off;
    }

    # Reverse proxy storage/uploads
    location /storage {
        proxy_pass http://backend:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy Excel template downloads
    location ~ ^/TEMPLATE_IMPORT_DATA_.*\.xlsx$ {
        proxy_pass http://backend:80;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Block access to source maps in production
    location ~* \.map$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Cache static hashed assets (only in /assets/)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # NEVER cache service worker, registerSW, and manifest
    location ~* ^/(sw\.js|registerSW\.js|manifest\.webmanifest)$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Cache other images and icons with revalidation
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, must-revalidate";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Handle React Router (SPA) - NEVER cache index.html
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Global fallback security headers
    include /etc/nginx/security-headers.conf;


    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
