version: "3.8"

# WAHA (WhatsApp HTTP API - devlikeapro/waha) — local development
# Run: docker compose -f docker-compose.waha.yml up -d
# UI:  http://localhost:3000
# API: http://localhost:3000/api

services:
  waha:
    image: devlikeapro/waha:latest
    container_name: simmaci-waha
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - WAHA_WORKER_ID=waha
      - WAHA_PRINT_QR=False
      - WAHA_API_KEY=${WAHA_API_KEY:-}
      - WAHA_DASHBOARD_ENABLED=True
      - WAHA_DASHBOARD_USERNAME=admin
      - WAHA_DASHBOARD_PASSWORD=${WAHA_DASHBOARD_PASSWORD:-}
      - WHATSAPP_DEFAULT_ENGINE=NOWEB
    volumes:
      - ./waha_sessions:/app/.sessions
    networks:
      - simmaci-network
      - default

networks:
  simmaci-network:
    external: true
    name: simmaci_simmaci-network
